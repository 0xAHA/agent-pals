[package]
name = "agent-pals"
version = "0.3.1"
description = "Pixel-art pals above the Windows taskbar that act out what your coding agents are doing"
license = "MIT"
repository = "https://github.com/0xAHA/agent-pals"
edition = "2021"

[[bin]]
name = "agent-pals"
path = "src/main.rs"

[[bin]]
name = "hook-relay"
path = "src/bin/hook-relay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: the relay rewrites the user's Claude Code settings.json and must keep its key order
serde_json = { version = "1", features = ["preserve_order"] }
png = "0.17"
tray-icon = "0.19"

[build-dependencies]
embed-resource = "3"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
